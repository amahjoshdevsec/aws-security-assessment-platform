name: Scheduled multi-account assessment
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: enterprise-prowler-scans
  cancel-in-progress: false
jobs:
  inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - id: inventory
        run: |
          matrix=$(python3 scripts/governance.py matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  scan:
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: security-scans
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_TOOLING_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REPORT_REGION }}
          role-session-name: prowler-${{ github.run_id }}
          role-duration-seconds: 3600
          allowed-account-ids: ${{ vars.AWS_TOOLING_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Assess and publish private evidence
        env:
          ACCOUNT_ID: ${{ matrix.account }}
          SCAN_REGION: ${{ matrix.region }}
          SCAN_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          REPORT_BUCKET: ${{ vars.REPORT_BUCKET }}
          REPORT_KMS_KEY_ARN: ${{ vars.REPORT_KMS_KEY_ARN }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/scan.py --account "$ACCOUNT_ID" --region "$SCAN_REGION" --run-id "$SCAN_RUN_ID"
  assessment-status:
    if: always()
    needs: [inventory, scan]
    runs-on: ubuntu-latest
    steps:
      - name: Require every account and region to complete
        env:
          INVENTORY_RESULT: ${{ needs.inventory.result }}
          SCAN_RESULT: ${{ needs.scan.result }}
        run: test "$INVENTORY_RESULT" = success && test "$SCAN_RESULT" = success
